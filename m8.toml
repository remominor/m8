# m8's config. Paths are relative to this file. Each model is a server m8 calls: point the URLs
# at your own.

[mate]
name = "Kevin"
# The persona: its prompts and level stories (examples/kevin is Kevin, the Halo CE teammate).
persona = "examples/kevin"
# Breeze base URL and existing saved profile (no local reference WAV or transcript).
voice_server = "https://tts.remominor.com"
voice = "soldier"
voice_sample_rate = 24000
# Fixed noise seed, so every line comes out in the same voice.
voice_seed = 42
voice_guidance_scale = 2.0

[mic]
# Talk over the mate to cut it off (use headphones, or it can hear itself through speakers).
barge_in = true
# Only used when barge_in = false: ignore the mic entirely while the mate is talking.
mute_while_speaking = true
# Silero VAD sensitivity (0-1, higher = needs clearer speech).
vad_threshold = 0.5
# How long you must pause before your sentence counts as finished.
end_of_speech_silence = 0.1
# Save every clip it hears to recordings/ (for debugging recognition).
save_recordings = false

[stt]
# Parakeet Unified: complete OpenAI-style transcription URL.
url = "https://stt.remominor.com/v1/audio/transcriptions"
model = "parakeet"

[kev]
# Clef System One via Unraid llama-swap: complete URL.
url = "https://llama.remominor.com/v1/systemone"
model = "clef-flash-artemis"
# Total System One request budget; dialogue and vision keep their own timeout.
timeout_ms = 5000

[llm]
# Gemma dialogue and vision via local llama-swap: complete URL.
url = "https://llm.remominor.com/v1/chat/completions"
model = "g4-12b-mtp-vision-it"
temperature = 1.0

[models]
# Silero VAD, which runs in m8: it finds where speech starts and ends in the mic's audio.
silero_vad = "models/silero_vad.onnx"

[game]
port = 47800
